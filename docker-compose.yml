services:
  # 4. Portainer
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data



  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/lg/services/caddyReverseProxy/config:/etc/caddy
      - /home/lg/services/caddyReverseProxy/site:/var/www/html



  cloudflared:
    # community build with armv7 (32-bit) support, the official image has none
    image: ghcr.io/shmick/docker-cloudflared
    container_name: cloudflared
    restart: unless-stopped
    # host network so the tunnel can reach the Pi's sshd on localhost:22
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}



  main-dashboard:
    build: main-dashboard
    container_name: main-dashboard
    restart: unless-stopped
    ports:
      - "8082:80"
